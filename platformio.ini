; PlatformIO project for microLXMF library development + native tests.
;
; Consumers should pull microLXMF in via `lib_deps`; this ini is only used
; to drive the library's own host-side test runs.

[env]
build_flags =
    -std=gnu++17
    -Isrc
    -Isrc/LXMF

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DMICROLXMF_NATIVE=1
    -DNATIVE=1
    -DLIBRARY_TEST=1
test_framework = unity
test_build_src = yes
